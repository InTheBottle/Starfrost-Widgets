; Starfrost Widgets
;
; Press the edit key in game (Insert by default) to drag the widgets around and
; tweak everything live. Changes are written back to this file when you leave
; edit mode, so hand editing and in-game editing agree.

[General]
; Master switch for every widget.
bEnabled = true
; DirectInput scan code that opens the move/edit overlay. 210 = Insert.
iEditModeKey = 210
; Multiplies every widget's own scale.
fGlobalScale = 1.000000
; 0.05 - 1.0
fOpacity = 1.000000
; Hide while a menu (inventory, map, dialogue...) is open.
bHideInMenus = true
; Follow the game's own HUD visibility, so screenshots stay clean.
bHideWhenHUDHidden = true
; Only show the need widgets while Survival Mode is switched on.
bRequireSurvivalMode = true
; Print the raw need value under each widget.
bShowValues = false
; Print the time left under the buff widgets (food, alcohol, blessing).
bShowTimers = true
; Badge the buff widgets with what they fortify: a red circle for health,
; a blue diamond for magicka, a green triangle for stamina, an orange
; square for warmth.
bShowAttributes = true
; Pulse the widget at the highest severity stage.
bPulseAtCritical = true
; Seconds between reads of the game's need globals.
fPollInterval = 0.250000
; Where the overlay draws.
;   0 = auto              - the game's framebuffer when it can be found, else the back buffer
;   1 = swap chain        - always the back buffer (the pre-1.1.0 behaviour)
;   2 = game framebuffer  - always the game's framebuffer
; Frame generation composites the back buffer itself and would overwrite anything
; drawn there, so leave this at 0 (or set 2) if you use it. Only try 1 if the
; widgets misbehave with frame generation switched off.
iRenderTarget = 0

; Stage colours run 0 (satisfied) to 5 (critical) as RRGGBB.
; Injuries only have four states, so they use stages 0, 2, 4 and 5.

[Hunger]
bEnabled = true
; Position as a fraction of screen size, so it survives resolution changes.
fPosX = 0.030000
fPosY = 0.300000
fScale = 1.000000
; 0 = ring gauge, 1 = icon only, 2 = bar
iStyle = 0
; Only draw this widget once it has something to say. Needs and injuries
; appear as they get worse; buff timers appear as they run down.
bDynamic = false
; The stage bDynamic starts drawing at, 1 - 5.
iShowFromStage = 1
sStage0Color = 6FCF7F
sStage1Color = B7D96B
sStage2Color = E8C15A
sStage3Color = E3924A
sStage4Color = D4593C
sStage5Color = B3232B

